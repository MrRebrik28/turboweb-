<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Загрузка модели | TIMETRY BIKES</title>
  <script>
    (function() {
      var path = window.location.pathname;
      var clean = path.replace(/^\/timetry\/?/, '').replace(/^\//, '').replace(/\/$/, '');
      if (clean && !clean.includes('.') && clean !== 'index' && clean !== 'product' && clean !== 'checkout' && clean !== 'admin') {
        var base = path.indexOf('/timetry/') !== -1 ? '/timetry/' : '/';
        window.location.replace(base + 'product.html?model=' + encodeURIComponent(clean));
      } else {
        window.location.replace('index.html');
      }
    })();
  </script>
</head>
<body style="background: #0f172a; color: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center;">
    <div style="width: 40px; height: 40px; border: 3px solid rgba(249, 115, 22, 0.2); border-top-color: #f97316; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;"></div>
    <div style="font-size: 1rem; font-weight: 600; color: #ffffff;">Переход к карточке велосипеда...</div>
  </div>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
